;PlatformIO Project Configuration File for ESP32-2432S028 (CYD)
;NexusDeck Hardware Controller (ESP32-2432S028 CYD)

[env:esp32-2432S028]
platform = espressif32
board = esp32dev
framework = arduino
; 3MB app partition (no OTA): room for MP3 decoder + SD + sensors.
; Default 1.25MB overflows with audio libraries.
board_build.partitions = huge_app.csv

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Build flags for ESP32-2432S028
build_flags =
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    -DUSE_HSPI_PORT

; Libraries
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^6.21.3
    thingpulse/ThingPulse XPT2046 Touch@^1.4
    tzapu/WiFiManager@^2.0.17
    ricmoo/QRCode@^0.0.1
    earlephilhower/ESP8266Audio@^1.9.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14


; Upload settings
upload_speed = 921600
