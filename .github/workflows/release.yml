name: Release

# Publish a GitHub Release by pushing a tag, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
# Manual runs (workflow_dispatch) only build artifacts for testing.

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: streamdeck-simulator/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone executable
        run: pyinstaller nexusdeck.spec

      - name: Package release zip
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -eq 'main' -or $ver -eq 'master') { $ver = 'dev' }
          # Remove any stale archive committed/left in the workspace BEFORE
          # packaging. The v2.4.9 installer shipped the old 2.4.4 companion
          # because the artifact glob matched a stale zip and the installer
          # job took "the first" one. Never let that happen again.
          Remove-Item -Path *.zip, *.sha256, *.tar.gz -Force -ErrorAction SilentlyContinue
          # Features are detected from the SOURCE we just built (not assumed),
          # so a checkout missing the LED UI fails the build loudly.
          $features = @()
          if (Select-String -Path ../../streamdeck-simulator/js/studio-ui.js -Pattern 'btn-toggle-light' -Quiet) { $features += 'light-panel' }
          if (Select-String -Path ./server.py -Pattern '/api/led-presets' -Quiet) { $features += 'led-presets' }
          if ($features.Count -lt 2) {
            Write-Error "Build source is missing LED UI features (found: $($features -join ', '))"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist/NexusDeckCompanion.exe pkg/
          Copy-Item ../../tools/release/Run-NexusDeck.bat pkg/
          Copy-Item ../../tools/release/README.txt pkg/
          Copy-Item assets/nexusdeck.ico pkg/
          Copy-Item ../../tools/setup-hostname.ps1, ../../tools/trust-cert.ps1, ../../tools/setup-https.ps1 pkg/
          @{
            version = $ver
            commit = "${{ github.sha }}"
            built_at = (Get-Date).ToUniversalTime().ToString('o')
            features = $features
          } | ConvertTo-Json | Out-File pkg/build-info.json -Encoding utf8
          $zip = "NexusDeck-$ver-windows-x64.zip"
          Compress-Archive -Path pkg/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
          Get-ChildItem *.zip, *.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            streamdeck-simulator/server/*.zip
            streamdeck-simulator/server/*.sha256

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: streamdeck-simulator/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone binary
        run: pyinstaller nexusdeck.spec

      - name: Package release tarball
        run: |
          ver="${{ github.ref_name }}"
          if [ "$ver" = "main" ] || [ "$ver" = "master" ]; then ver="dev"; fi
          # Stale archives must never leak into the release artifacts.
          rm -f ./*.zip ./*.tar.gz ./*.sha256
          if ! grep -q 'btn-toggle-light' ../../streamdeck-simulator/js/studio-ui.js \
             || ! grep -q '/api/led-presets' ./server.py; then
            echo "::error::Build source is missing LED UI features (light panel / led-presets)"
            exit 1
          fi
          mkdir -p pkg
          cp dist/NexusDeckCompanion pkg/
          cp ../../tools/release/run-nexusdeck.sh ../../tools/release/README.txt pkg/
          cp ../../tools/installer/linux/install.sh ../../tools/installer/linux/nexusdeck.desktop pkg/
          cp assets/nexusdeck-blue.png pkg/nexusdeck.png
          printf '{"version":"%s","commit":"%s","built_at":"%s","features":["light-panel","led-presets"]}\n' \
            "$ver" "${{ github.sha }}" "$(date -u +%FT%TZ)" > pkg/build-info.json
          chmod +x pkg/NexusDeckCompanion pkg/run-nexusdeck.sh pkg/install.sh
          tarball="NexusDeck-$ver-linux-x64.tar.gz"
          tar -czf "$tarball" -C pkg .
          sha256sum "$tarball" > "$tarball.sha256"
          # Fixed "latest" name so the website can link directly to
          # releases/latest/download/<fixed-name> without visiting the repo.
          cp "$tarball" "NexusDeck-latest-linux-x64.tar.gz"
          sha256sum "NexusDeck-latest-linux-x64.tar.gz" > "NexusDeck-latest-linux-x64.tar.gz.sha256"
          ls -la *.tar.gz *.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            streamdeck-simulator/server/*.tar.gz
            streamdeck-simulator/server/*.sha256

  build-firmware:
    # ubuntu-24.04 on purpose: ubuntu-latest moved to Ubuntu 26 (Oct 2026)
    # where the espressif32 toolchain is not runnable yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ESP32 firmware
        run: |
          pip install platformio
          pio run -d esp32-firmware
          ver="${{ github.ref_name }}"
          if [ "$ver" = "main" ] || [ "$ver" = "master" ]; then ver="dev"; fi
          cp esp32-firmware/.pio/build/esp32-2432S028/firmware.bin \
             "firmware-esp32-2432S028-$ver.bin"
          sha256sum "firmware-esp32-2432S028-$ver.bin" > "firmware-esp32-2432S028-$ver.bin.sha256"
          # Fixed "latest" name for direct website downloads.
          cp "firmware-esp32-2432S028-$ver.bin" "firmware-esp32-2432S028-latest.bin"
          sha256sum "firmware-esp32-2432S028-latest.bin" > "firmware-esp32-2432S028-latest.bin.sha256"
          ls -la firmware-esp32-*.bin*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            firmware-esp32-*.bin*

  build-installer-windows:
    needs: [build-windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: staging

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build Setup.exe
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -eq 'main' -or $ver -eq 'master') { $ver = 'dev' }
          # Pick the EXACT archive this run built. Never "the first zip":
          # that is how v2.4.9's installer ended up shipping the stale 2.4.4
          # companion from a zip that was committed to the repo.
          $expected = "NexusDeck-$ver-windows-x64.zip"
          $zipFile = Get-ChildItem staging -Filter $expected | Select-Object -First 1
          if (-not $zipFile) {
            Get-ChildItem staging | ForEach-Object { Write-Host "staged: $($_.Name)" }
            Write-Error "Expected $expected in the Windows artifact (stale or missing zip)"
            exit 1
          }
          Write-Host "Using archive: $($zipFile.Name) ($($zipFile.Length) bytes)"
          Expand-Archive -LiteralPath $zipFile.FullName -DestinationPath staging/pkg -Force
          $exePath = Join-Path (Join-Path (Get-Location) 'staging/pkg') 'NexusDeckCompanion.exe'
          if (-not (Test-Path $exePath)) {
            Write-Error "NexusDeckCompanion.exe missing from $expected"
            exit 1
          }
          # build-info.json is written by the build job: a stale zip has an
          # older version (or none) and must fail here, not ship.
          $infoPath = Join-Path (Join-Path (Get-Location) 'staging/pkg') 'build-info.json'
          if (-not (Test-Path $infoPath)) {
            Write-Error "build-info.json missing from $expected (stale archive?)"
            exit 1
          }
          $info = Get-Content $infoPath -Raw | ConvertFrom-Json
          if ($info.version -ne $ver) {
            Write-Error "Archive version '$($info.version)' does not match release '$ver'"
            exit 1
          }
          if (-not ($info.features -contains 'light-panel')) {
            Write-Error "BUILD VERIFY FAILED: archive lacks the light-panel feature"
            exit 1
          }
          Write-Host "Verified companion build: $($info | ConvertTo-Json -Compress)"
          # NOTE: StagingDir must be absolute - Inno resolves relative Source
          # paths against the script's own directory, not the working dir.
          $stagingAbs = Join-Path (Get-Location) 'staging/pkg'
          # choco now ships Inno Setup 7 (installed under "Inno Setup 7");
          # search both installs so the build works on 6.x and 7.x.
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 7\iscc.exe",
                     "${env:ProgramFiles}\Inno Setup 7\iscc.exe",
                     "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe",
                     "${env:ProgramFiles}\Inno Setup 6\iscc.exe") |
                   Where-Object { Test-Path $_ } |
                   Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found after choco install"; exit 1 }
          Write-Host "Using ISCC: $iscc"
          Remove-Item -Path installer-out -Recurse -Force -ErrorAction SilentlyContinue
          & $iscc /DMyAppVersion="$ver" /DStagingDir="$stagingAbs" /O"installer-out" tools/installer/windows/setup.iss
          $exe = Get-ChildItem installer-out/*.exe | Select-Object -First 1
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash + "  $($exe.Name)" | Out-File "$($exe.FullName).sha256" -Encoding ascii
          # Fixed "latest" name so the website can link directly to
          # releases/latest/download/NexusDeck-Setup-latest-windows-x64.exe.
          Copy-Item $exe.FullName "installer-out/NexusDeck-Setup-latest-windows-x64.exe"
          (Get-FileHash "installer-out/NexusDeck-Setup-latest-windows-x64.exe" -Algorithm SHA256).Hash + "  NexusDeck-Setup-latest-windows-x64.exe" | Out-File "installer-out/NexusDeck-Setup-latest-windows-x64.exe.sha256" -Encoding ascii
          Get-ChildItem installer-out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: |
            installer-out/*.exe
            installer-out/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-firmware, build-installer-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
