name: Release

# Publish a GitHub Release by pushing a tag, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
# Manual runs (workflow_dispatch) only build artifacts for testing.

on:
  push:
    tags: ['v*', 'V*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: streamdeck-simulator/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone executable
        run: pyinstaller nexusdeck.spec

      - name: Package release zip
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -eq 'main' -or $ver -eq 'master') { $ver = 'dev' }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          Copy-Item dist/NexusDeckCompanion.exe pkg/
          Copy-Item ../../tools/release/Run-NexusDeck.bat pkg/
          Copy-Item ../../tools/release/README.txt pkg/
          Copy-Item assets/nexusdeck.ico pkg/
          Copy-Item ../../tools/setup-hostname.ps1, ../../tools/trust-cert.ps1, ../../tools/setup-https.ps1 pkg/
          $zip = "NexusDeck-$ver-windows-x64.zip"
          Compress-Archive -Path pkg/* -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash + "  $zip" | Out-File "$zip.sha256" -Encoding ascii
          Get-ChildItem *.zip, *.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            streamdeck-simulator/server/*.zip
            streamdeck-simulator/server/*.sha256

  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
        working-directory: streamdeck-simulator/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build standalone binary
        run: pyinstaller nexusdeck.spec

      - name: Package release tarball
        run: |
          ver="${{ github.ref_name }}"
          if [ "$ver" = "main" ] || [ "$ver" = "master" ]; then ver="dev"; fi
          mkdir -p pkg
          cp dist/NexusDeckCompanion pkg/
          cp ../../tools/release/run-nexusdeck.sh ../../tools/release/README.txt pkg/
          cp ../../tools/installer/linux/install.sh ../../tools/installer/linux/nexusdeck.desktop pkg/
          cp assets/nexusdeck-blue.png pkg/nexusdeck.png
          chmod +x pkg/NexusDeckCompanion pkg/run-nexusdeck.sh pkg/install.sh
          tarball="NexusDeck-$ver-linux-x64.tar.gz"
          tar -czf "$tarball" -C pkg .
          sha256sum "$tarball" > "$tarball.sha256"
          ls -la *.tar.gz *.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            streamdeck-simulator/server/*.tar.gz
            streamdeck-simulator/server/*.sha256

  build-firmware:
    # ubuntu-24.04 on purpose: ubuntu-latest moved to Ubuntu 26 (Oct 2026)
    # where the espressif32 toolchain is not runnable yet.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ESP32 firmware
        run: |
          pip install platformio
          pio run -d esp32-firmware
          ver="${{ github.ref_name }}"
          if [ "$ver" = "main" ] || [ "$ver" = "master" ]; then ver="dev"; fi
          cp esp32-firmware/.pio/build/esp32-2432S028/firmware.bin \
             "firmware-esp32-2432S028-$ver.bin"
          sha256sum firmware-esp32-2432S028-*.bin > firmware-esp32-2432S028-$ver.bin.sha256
          ls -la firmware-esp32-*.bin*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            firmware-esp32-*.bin*

  build-installer-windows:
    needs: [build-windows]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: staging

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Build Setup.exe
        run: |
          $ver = "${{ github.ref_name }}"
          if ($ver -eq 'main' -or $ver -eq 'master') { $ver = 'dev' }
          # Resolve the zip explicitly: a wildcard Path here can resolve to
          # multiple files on newer PowerShell (zip + .zip.sha256) and fail.
          $zipFile = Get-ChildItem staging -Filter *.zip | Select-Object -First 1
          if (-not $zipFile) { Write-Error "No Windows zip found in staging artifact"; exit 1 }
          Expand-Archive -LiteralPath $zipFile.FullName -DestinationPath staging/pkg -Force
          # NOTE: StagingDir must be absolute - Inno resolves relative Source
          # paths against the script's own directory, not the working dir.
          $stagingAbs = Join-Path (Get-Location) 'staging/pkg'
          # choco now ships Inno Setup 7 (installed under "Inno Setup 7");
          # search both installs so the build works on 6.x and 7.x.
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 7\iscc.exe",
                     "${env:ProgramFiles}\Inno Setup 7\iscc.exe",
                     "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe",
                     "${env:ProgramFiles}\Inno Setup 6\iscc.exe") |
                   Where-Object { Test-Path $_ } |
                   Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found after choco install"; exit 1 }
          Write-Host "Using ISCC: $iscc"
          & $iscc /DMyAppVersion="$ver" /DStagingDir="$stagingAbs" /O"installer-out" tools/installer/windows/setup.iss
          $exe = Get-ChildItem installer-out/*.exe | Select-Object -First 1
          (Get-FileHash $exe.FullName -Algorithm SHA256).Hash + "  $($exe.Name)" | Out-File "$($exe.FullName).sha256" -Encoding ascii
          Get-ChildItem installer-out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-installer
          path: |
            installer-out/*.exe
            installer-out/*.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-firmware, build-installer-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
